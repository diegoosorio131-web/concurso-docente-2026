name: Publicar GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # Solo se publican los archivos que necesita la pagina.
      # Quedan fuera supabase/ (banco de preguntas con respuestas), scripts/,
      # data/class4-extracted/ y la documentacion interna.
      - name: Copiar solo archivos publicos
        run: |
          mkdir -p _site/data
          cp index.html app.js auth.js config.js dashboard.js styles.css theme.css fonts.css .nojekyll _site/
          cp -r assets _site/
          cp data/news-data.js _site/data/
          cp -r data/class4-source _site/data/

      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
